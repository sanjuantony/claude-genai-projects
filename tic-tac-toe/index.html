<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic-Tac-Toe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      font-family: 'Segoe UI', sans-serif;
      color: #eee;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #e94560;
    }

    #status {
      font-size: 1.1rem;
      margin-bottom: 1.5rem;
      min-height: 1.5rem;
      color: #a8dadc;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(3, 110px);
      grid-template-rows: repeat(3, 110px);
      gap: 8px;
    }

    .cell {
      background: #16213e;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      user-select: none;
    }

    .cell:hover:not(.taken) {
      background: #0f3460;
      transform: scale(1.05);
    }

    .cell.x { color: #e94560; }
    .cell.o { color: #a8dadc; }

    .cell.win {
      background: #0f3460;
      animation: pulse 0.6s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to   { transform: scale(1.08); }
    }

    #controls {
      margin-top: 1.5rem;
      display: flex;
      gap: 1rem;
    }

    button {
      padding: 0.6rem 1.4rem;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.15s, transform 0.1s;
    }

    button:hover { opacity: 0.85; transform: scale(1.03); }

    #btn-reset { background: #e94560; color: #fff; }

    #mode-toggle {
      background: #0f3460;
      color: #a8dadc;
      border: 1px solid #a8dadc;
    }

    #score {
      margin-top: 1.2rem;
      display: flex;
      gap: 2rem;
      font-size: 0.9rem;
      color: #888;
    }

    #score span { font-weight: 700; font-size: 1rem; }
    .score-x { color: #e94560; }
    .score-o { color: #a8dadc; }
  </style>
</head>
<body>

<h1>Tic-Tac-Toe</h1>
<div id="status">Player X's turn</div>

<div id="board">
  <div class="cell" data-i="0"></div>
  <div class="cell" data-i="1"></div>
  <div class="cell" data-i="2"></div>
  <div class="cell" data-i="3"></div>
  <div class="cell" data-i="4"></div>
  <div class="cell" data-i="5"></div>
  <div class="cell" data-i="6"></div>
  <div class="cell" data-i="7"></div>
  <div class="cell" data-i="8"></div>
</div>

<div id="controls">
  <button id="btn-reset">New Game</button>
  <button id="mode-toggle">vs CPU</button>
</div>

<div id="score">
  <div>X <span id="score-x" class="score-x">0</span></div>
  <div>Draws <span id="score-d">0</span></div>
  <div>O <span id="score-o" class="score-o">0</span></div>
</div>

<script>
  const WINS = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  let board, current, over, vsAI;
  let scores = { X: 0, O: 0, D: 0 };

  const cells      = document.querySelectorAll('.cell');
  const statusEl   = document.getElementById('status');
  const resetBtn   = document.getElementById('btn-reset');
  const modeBtn    = document.getElementById('mode-toggle');
  const scoreX     = document.getElementById('score-x');
  const scoreO     = document.getElementById('score-o');
  const scoreD     = document.getElementById('score-d');

  function init(keepMode) {
    if (!keepMode) vsAI = false;
    board   = Array(9).fill(null);
    current = 'X';
    over    = false;
    cells.forEach(c => { c.textContent = ''; c.className = 'cell'; });
    statusEl.textContent = "Player X's turn";
  }

  function checkWin(b, p) {
    return WINS.find(([a, bb, c]) => b[a] === p && b[bb] === p && b[c] === p) || null;
  }

  function isDraw(b) { return b.every(Boolean); }

  function render() {
    board.forEach((v, i) => {
      cells[i].textContent = v || '';
      if (v) cells[i].classList.add(v.toLowerCase(), 'taken');
    });
  }

  function endGame(winner, line) {
    over = true;
    if (winner) {
      line.forEach(i => cells[i].classList.add('win'));
      scores[winner]++;
      updateScore();
      statusEl.textContent = vsAI && winner === 'O'
        ? 'CPU wins!'
        : `Player ${winner} wins!`;
    } else {
      scores.D++;
      updateScore();
      statusEl.textContent = "It's a draw!";
    }
  }

  function updateScore() {
    scoreX.textContent = scores.X;
    scoreO.textContent = scores.O;
    scoreD.textContent = scores.D;
  }

  function humanMove(i) {
    if (over || board[i]) return;
    board[i] = current;
    render();
    const line = checkWin(board, current);
    if (line) { endGame(current, line); return; }
    if (isDraw(board)) { endGame(null, []); return; }
    current = current === 'X' ? 'O' : 'X';
    statusEl.textContent = vsAI ? "Your turn (X)" : `Player ${current}'s turn`;
    if (vsAI && current === 'O') {
      statusEl.textContent = "CPU is thinking…";
      setTimeout(aiMove, 350);
    }
  }

  /* Minimax AI */
  function minimax(b, isMax) {
    if (checkWin(b, 'O')) return  10;
    if (checkWin(b, 'X')) return -10;
    if (isDraw(b))        return   0;
    let best = isMax ? -Infinity : Infinity;
    for (let i = 0; i < 9; i++) {
      if (!b[i]) {
        b[i] = isMax ? 'O' : 'X';
        const score = minimax(b, !isMax);
        b[i] = null;
        best = isMax ? Math.max(best, score) : Math.min(best, score);
      }
    }
    return best;
  }

  function aiMove() {
    let best = -Infinity, move = -1;
    for (let i = 0; i < 9; i++) {
      if (!board[i]) {
        board[i] = 'O';
        const score = minimax(board, false);
        board[i] = null;
        if (score > best) { best = score; move = i; }
      }
    }
    board[move] = 'O';
    render();
    const line = checkWin(board, 'O');
    if (line) { endGame('O', line); return; }
    if (isDraw(board)) { endGame(null, []); return; }
    current = 'X';
    statusEl.textContent = "Your turn (X)";
  }

  cells.forEach(c => c.addEventListener('click', () => {
    if (vsAI && current === 'O') return;
    humanMove(+c.dataset.i);
  }));

  resetBtn.addEventListener('click', () => init(true));

  modeBtn.addEventListener('click', () => {
    vsAI = !vsAI;
    modeBtn.textContent = vsAI ? 'vs Human' : 'vs CPU';
    init(true);
    if (vsAI) statusEl.textContent = "Your turn (X)";
  });

  init();
</script>
</body>
</html>
